---
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      time: "07:25"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(deps): "
      prefix-development: "chore(deps): "
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      time: "07:35"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps): "
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      time: "07:45"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "build(deps): "
      prefix-development: "chore(deps): "
    cooldown:
      default-days: 7
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: weekly
      time: "07:55"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps): "
    cooldown:
      default-days: 7
